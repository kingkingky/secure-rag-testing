name: RAG Security Tests

on:
  push:
  pull_request:

jobs:
  security-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: secure-rag-testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: secure-rag-testing/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run security tests
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -v test_security.py