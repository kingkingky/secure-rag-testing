name: LLM Security Evaluation

on:
  push:
  pull_request:

jobs:
  security-evaluation:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: LLM_Security_Evaluation_Framework

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Evaluation
        run: |
          python main.py

      - name: Run Tests
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -v
